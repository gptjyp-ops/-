name: Publish shared storage backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Set database ID
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          if(!/^[0-9a-f-]{36}$/i.test(process.env.D1_DATABASE_ID||''))throw Error('Set the D1_DATABASE_ID repository variable first.');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.d1_databases[0].database_id=process.env.D1_DATABASE_ID;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config));
          JS
      - run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
